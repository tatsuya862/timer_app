<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>集中タイマー | Quant Log Timer</title>
  <meta name="description" content="25分集中と5分休憩を直感操作で管理する、トレードや作業向けのシンプルな集中タイマー。">
  <link rel="stylesheet" href="styles.css?v=serif-prototype-01" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="https://tatsuya862.github.io/japanese-quant-log/">
      <span class="brand-main">QUANT LOG</span>
      <span class="brand-sub">by Tatsuya</span>
    </a>
    <span class="app-kicker">Prototype 02</span>
  </header>

  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">Timer</p>
      <h1>フォーカスタイマー</h1>
      <p class="subtitle">フォーカス 25min / ブレイク 5min</p>
    </section>

    <section class="timer-card">
      <div class="timer-state" data-mode>フォーカス</div>
      <div class="timer-face">
        <div class="timer-display" data-minute>25</div>
        <div class="timer-display seconds" data-seconds>:00</div>
      </div>
      <div class="timer-controls">
        <button id="start-pause">スタート</button>
        <button id="reset">リセット</button>
      </div>
      <div class="timer-meta">
        <span>サイクル: <strong data-cycle>0</strong></span>
        <span>次セッション: <strong data-next>ブレイク：05:00</strong></span>
      </div>
    </section>

    <!--
    <section class="notes">
      <h2>使い方</h2>
      <ol>
        <li>「開始」で25分集中。</li>
        <li>終了後は5分休憩へ自動切替。</li>
        <li>「停止/再開」で中断と再開。</li>
        <li>「リセット」で最初に戻ります。</li>
      </ol>
    </section>
    -->
  </main>
  <script src="timer.js"></script>
</body>
</html>
